[package]
name = "lumina-kernel"
description = "Lumina OS 内核映像 —— multiboot1 启动 → x86_64 长模式 → Bedrock 框架自检（SPEC 表 19-1 P0）"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# 宿主 CI（S1–S5）不构建本 crate（required-features 未满足时 bin 被跳过）；
# 仅 S6 内核构建阶段以 --features boot + 自定义目标 x86_64-lumina 启用。
boot = []
# M23-② interactive 面：自检通过后不关机，派 init（PID 1 ring3 shell）
# 进入交互面（halt 命令终结 → INIT_EXIT 透传 kernel_exit）。批跑/回归
# 构建不用本特性（默认路径自检后立即退出，pf-hunt 判定面零扰动）。
interactive = []
# M33-R1 longrun 面：自检通过后不关机，进入 1080p 扫描带 compose tick
# 循环（S10-longrun Panel B 长稳显示 tick 面板）——每 16 拍心跳行串口
# 取证，同步字节/交盒像素任一失配即失败退出（fail-visible）。与
# interactive 互斥（同给时 interactive 优先——外层 cfg(not(interactive))
# 收束）；批跑/回归构建不用本特性，S8 门禁路径零扰动。60fps 实时率
# 口径归真机窗口（TCG 下宿主记录实测 fps 信息面不设闸——M33-R1）。
longrun = []

[dependencies]
# ADR-0002 迁移步（M26）：SYS 文件面改道 meridian::vfs（挂载策略 + 门面聚合）
meridian.workspace = true
# M26-T1：t76 活体消费 crystal 格式 v1 装配面（format/mount/WAL 回放/快照 O(1)）
crystal.workspace = true

ostd.workspace = true
# ADR-0003（M29-N1）：harbor 依赖退役——堆分配器归 ostd::heap，harbor 重铸 POSIX libc
bedrock.workspace = true
vanguard.workspace = true
weave.workspace = true
mirror.workspace = true
conduit.workspace = true
# M27-N2：UDP 段面单一事实源消费（UdpHdr 编解码 + RFC768 伪头校验和 + 端口表）
pulse.workspace = true
# M28-K1：组合器执行器消费 prism 合成结构面（z 序仲裁/交盒逐像素裁决——
# v0 单层 stage 面；PR-P02 内核承接口）
prism.workspace = true
# M30-T1：t79 桌面骨架活体消费三面——loom Elm 架构（fold+布局求解）、
# cascade shell 语义（工作区+平铺计划）、glyph 图标渲染（同源光栅化）
loom.workspace = true
cascade.workspace = true
glyph.workspace = true
# M31-N1：scancode set 1 翻译面单一事实源消费（驱动旁路缩编首割——
# 纯函数零依赖外移，电气/机制面留 kernel::kbd 本体）
morse.workspace = true
# M32-T1：t81 aurora 活体消费三面——perm 权限四相（内核态收口首演）、
# AppRuntime 生命周期拦截矩阵（AF-P03/P06）、LuappManifest 清单闸
#（aurora no_std+alloc 形态——A1 转换即为此内核消费铺路）
aurora.workspace = true

[[bin]]
name = "lumina-kernel"
path = "src/main.rs"
required-features = ["boot"]
