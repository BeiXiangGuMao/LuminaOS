# 编译产物与源码分离：target 目录指向源码树之外（用户要求：编译文件和源文件分类）。
# 源码树 lumina-os/ 内永不出现 target/；产物与日志统一落在 /home/z/my-project/lumina-build/。
[build]
target-dir = "/home/z/my-project/lumina-build/target"

[term]
color = "auto"

# 内核构建目标（M2）：stable 工具链下自定义 JSON 目标规范被 -Zjson-target-spec
# 门控，故以内置 x86_64-unknown-none + 全量 rustflags 等效承载 Lumina 规范
# （内置 none 目标默认禁 SSE/红区=软浮点语义；此处补 static 重定位与 panic=abort）。targets/x86_64-lumina.json
# 保留为规范定义，待门控稳定后切换为 --target x86_64-lumina。
[target.x86_64-unknown-none]
rustflags = [
    "-C", "panic=abort",
    "-C", "relocation-model=static",
]
