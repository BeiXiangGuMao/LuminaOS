# Lumina OS lint 台账（M24-X1 上线）—— 允许矩阵 + 债务登记
#
# 位置：tools/xtask/allowlist.toml；消费者：`cargo run -p xtask -- lint`
# （ci S5c-lint 阶段同源）。
#
# 台账纪律：
#   1. 依赖边分两面——[[allowed_edges]] 是**政策面**（细则/架构裁决允许的
#      常态边，无需 ADR）；[[dep_exemptions]] 是**债务面**（现状违规但已由
#      ADR 裁决收口窗口的边），每项 MUST 携带 adr 与 until；
#   2. 新增依赖边 MUST 先改本台账再动 Cargo.toml——直接加边会被 lint 拒绝
#      （政策面变更走评审，债务面变更必须有 ADR 背书）；
#   3. [[mmodule_overreach]] 登记结构性越界模块（非依赖边，模块归属债）；
#   4. [[unsafe_allow]] 登记 unsafe 容忍面：无 path = 全 crate 允许层
#      （机制件）；有 path = 文件级白名单（债务，MUST 有 adr + until）；
#   5. until 到期未清账：清账批随迁移执行（如 ADR-0001 M26 收口时同步
#      删台账条目）；lint 对 until 仅展示不执法（里程碑语义由人来判）。
#   6. [dev-dependencies] / [build-dependencies] 不入依赖图（不随产物
#      发布；构建期/测试期依赖另立台账再议）。

[meta]
ledger_version = 1

# -------------------------------------------------------- 政策面：允许边

[[allowed_edges]]
from = "harbor"
to = "ostd"
note = "细则依赖方向：ostd → {harbor, vanguard} → bedrock"

[[allowed_edges]]
from = "vanguard"
to = "ostd"
note = "细则依赖方向同上"

[[allowed_edges]]
from = "lumina-kernel"
to = "ostd"
note = "内核消费机制层"

[[allowed_edges]]
from = "lumina-kernel"
to = "harbor"
note = "内核消费堆分配器（#[global_allocator]）"

[[allowed_edges]]
from = "lumina-kernel"
to = "bedrock"
note = "内核消费 abi/tlv/ipc/vfs 通信与文件面"

[[allowed_edges]]
from = "lumina-kernel"
to = "vanguard"
note = "内核消费驱动栈"

[[allowed_edges]]
from = "lumina-kernel"
to = "weave"
note = "内核消费 init/服务编排面"

[[allowed_edges]]
from = "lumina-kernel"
to = "mirror"
note = "内核消费显示合成面（SYS_FB 服务化，M23-S1 起）"

[[allowed_edges]]
from = "lumina-kernel"
to = "conduit"
note = "内核冒烟自检消费 conduit 布局快照/转换器活体（C-P04/C-P01 在环证据，M25-T1 起）"

[[allowed_edges]]
from = "conduit"
to = "bedrock"
note = "兼容层转换器消费 LXE1 事实源（abi 调用号/错误码表）；细则第 4 章 Conduit 定位（M25-C1 起）"

[[allowed_edges]]
from = "lumina-kernel"
to = "crystal"
note = "t76 活体消费 crystal 格式 v1 装配面（format/mount/WAL 回放/快照 O(1) 结构面证据）；M26-T1 起"

[[allowed_edges]]
from = "crystal"
to = "bedrock"
note = "crystal 消费 bedrock::block 块契约（平台无关 512B 块底座，格式 v1 骑行其上）；块契约终态随 Vanguard 驱动栈演进再议（M26-F1 起）"

[[allowed_edges]]
from = "crystal"
to = "ostd"
note = "FS 物理面/fd 底座共享状态同步（细则 4.3 指定 OSTD SpinLock）；ADR-0002 迁移步（M26-V1）"

[[allowed_edges]]
from = "meridian"
to = "crystal"
note = "挂载/命名空间策略面消费 crystal::vfs FS 侧契约（FileSystem/ResolvedNode/PathBuf）；ADR-0002 补篇（M26-V1）"

[[allowed_edges]]
from = "meridian"
to = "ostd"
note = "挂载表 SpinLock（细则 4.3 并发模型）；随 ADR-0002 迁移步落位（M26-V1）"

[[allowed_edges]]
from = "lumina-kernel"
to = "meridian"
note = "SYS_OPEN..SYS_MOUNT 文件面改道 meridian::vfs（挂载策略 + 全量门面聚合）；ADR-0002 补篇 + ADR-0004 混合态（M26-V1）"

[[allowed_edges]]
from = "prism"
to = "mirror"
note = "几何单一事实源：prism 合成结构面复用 mirror::Rect（交集/包含/面积），损伤计划由 mirror::DamageTracker 产出、prism::Stack::compose 消费；ADR-0006 名字归位（M28-F1）"

# -------------------------------------------------------- 债务面：依赖豁免



# -------------------------------------------------------- 债务面：模块越界

# [[module_overreach]] 现无在案条目：bedrock::vfs 已随 ADR-0002 迁移步（M26-V1）外移清账。
# 勘误记录：原条目段头误植为 [odule_overreach]]（自 M24-X1 起未被解析器读到的惰性失效），
# 随本批删除；段头笔误同步修正于文件头注释。

# -------------------------------------------------------- unsafe 容忍面

[[unsafe_allow]]
crate = "bedrock"
note = "自持同步原语（M26-V1-c 零依赖收口：SpinLock/SpscRing 等价内联，ADR-0001 终态 + ADR-0005 归 ostd 原则的登记例外——bedrock 拒绝对 ostd 的运行期依赖；unsafe 封装面 = unsafe impl Sync/Send + 槽位操作，API 全 safe）"

[[unsafe_allow]]
crate = "ostd"
note = "全仓唯一 unsafe 白名单 crate（收口层，ROADMAP §1.2；ADR-0005/0003 同构裁决：unsafe 机制件归 ostd）"

[[unsafe_allow]]
crate = "lumina-kernel"
note = "内核态本体（ring0 边界面：中断/任务/页表/端口 I/O）"

[[unsafe_allow]]
crate = "harbor"
path = "src/lib.rs"
note = "内核堆分配器（HarborBump/FreeList：unsafe impl Sync/GlobalAlloc + 裸指针操作），待迁 ostd::heap（M29 Harbor libc 首版同批清库重铸）"
adr = "ADR-0003"
until = "M29"

[[unsafe_allow]]
crate = "pulse"
path = "src/lib.rs"
note = "SpscRing 无锁环（UnsafeCell + 原子序数，crate 内唯一 unsafe 集中区），待迁 ostd::sync::spsc；pulse 终态 forbid(unsafe_code) 密度 0"
adr = "ADR-0005"
until = "M27"
