# 编译产物与源码分离：target 目录指向源码树之外（用户要求：编译文件和源文件分类）。
# 源码树 lumina-os/ 内永不出现 target/；产物与日志统一落在 /home/z/my-project/lumina-build/。
[build]
target-dir = "/home/z/my-project/lumina-build/target"

[term]
color = "auto"

# 内核裸机构建（bootloader/bootimage 路径）专用：仅在使用 --target 时生效（DEV-002 2.3）。
[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true
